name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chalo-be
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chalo-be/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --runInBand
      - run: pnpm build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chalo-fe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chalo-fe/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm build

  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir chalo-be install --frozen-lockfile
      - run: pnpm --dir chalo-fe install --frozen-lockfile
      - run: node scripts/audit-production-dependencies.mjs

  browser-session:
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chalo-fe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chalo-fe/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: PORT=3000 node .next/standalone/server.js > /tmp/chalo-fe.log 2>&1 &
      - run: for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:3000 >/dev/null && exit 0; sleep 1; done; cat /tmp/chalo-fe.log; exit 1
      - run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 pnpm exec playwright test e2e/auth-persistence.spec.ts --project=chromium
